<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMS Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="h-screen flex">
  <!-- Sidebar -->
  <div class="w-1/3 bg-white border-r overflow-y-auto">
    <h2 class="text-xl font-bold p-4 border-b">Conversations</h2>
    <ul id="numberList" class="divide-y divide-gray-200">
      <!-- Numbers will be populated here -->
    </ul>
  </div>

  <!-- Chat Window -->
  <div class="flex-1 flex flex-col">
    <div class="flex-1 overflow-y-auto p-4" id="messageList">
      <!-- Messages will be shown here -->
    </div>

<form id="messageForm" class="flex p-4 bg-white border-t">
  <input type="text" id="messageInput" name="body" placeholder="Your message..." class="flex-1 p-2 border rounded" required />
  <button type="submit" class="ml-2 bg-blue-500 text-white px-4 py-2 rounded">Send</button>
</form>
  </div>
</div>

<script>
const smsLog = [];
const numberSet = new Set();
let currentNumber = "";
const yourTwilioNumber = '+14075456070'; // Move this to the global scope

async function loadMessages(initial = false) {
  const res = await fetch('sms_log.json');
  const text = await res.text();
  const lines = text.trim().split('\n');
  smsLog.length = 0; // Clear old messages
lines.forEach(line => {
  try {
    const msg = JSON.parse(line);
    smsLog.push(msg);
    
    // Add the external contact to the numberSet
    if (msg.from && msg.from !== yourTwilioNumber) numberSet.add(msg.from);
    if (msg.to && msg.to !== yourTwilioNumber) numberSet.add(msg.to);
  } catch {}
});

  if (initial) {
    const list = document.getElementById('numberList');
    list.innerHTML = '';
    [...numberSet].forEach(number => {
      const li = document.createElement('li');
      li.textContent = number;
      li.className = 'p-4 cursor-pointer hover:bg-gray-100';
      li.onclick = () => showMessages(number);
      list.appendChild(li);
    });

    if (numberSet.size > 0) {
      showMessages([...numberSet][0]);
    }
  } else {
    showMessages(currentNumber);
  }
}

function showMessages(number) {
  currentNumber = number;
  const list = document.getElementById('messageList');
  list.innerHTML = '';
console.log("Current number:", number);
console.log("All SMS:", smsLog);
  smsLog
    .filter(msg =>
      (msg.from === yourTwilioNumber && msg.to === number) ||
      (msg.to === yourTwilioNumber && msg.from === number)
    )
    .forEach(msg => {
      const div = document.createElement('div');
      const isIncoming = msg.from === number;
      div.className = `mb-2 p-2 rounded max-w-xs ${
        isIncoming ? 'bg-gray-200 self-start' : 'bg-blue-500 text-white self-end ml-auto'
      }`;
      div.textContent = msg.body || '';
      list.appendChild(div);
    });

  list.scrollTop = list.scrollHeight;
}

document.getElementById("messageForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  const message = document.getElementById("messageInput").value.trim();

  if (!currentNumber || !message) {
    alert("Missing fields");
    return;
  }

  const timestamp = Math.floor(Date.now() / 1000);

  try {
    const res = await fetch("send_sms.php", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        to: currentNumber,
        body: message,
      }),
    });

    const text = await res.text();
    if (!res.ok) {
      alert("Failed to send: " + text);
      return;
    }

    // Inject the message immediately into chat
    smsLog.push({
      from: yourTwilioNumber,
      to: currentNumber,
      body: message,
      timestamp,
    });

    // Clear input and re-render the conversation
    document.getElementById("messageInput").value = "";
    showMessages(currentNumber);

  } catch (err) {
    alert("Error: " + err.message);
  }
});

// Initial load
loadMessages(true);

// Poll every 5 seconds
setInterval(() => loadMessages(false), 5000);
</script>

</body>
</html>
